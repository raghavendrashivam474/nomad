name: nomad_mobile
description: Nomad — Mobile-First Development Lab application.
version: 0.0.1+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  nomad_core:
    path: ../../packages/nomad_core
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.2
